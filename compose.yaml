name: podoria-crm

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podoria}
      POSTGRES_USER: ${POSTGRES_USER:-podoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podoria_dev_password}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  test-postgres:
    profiles: ["test"]
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: podoria_test
      POSTGRES_USER: podoria_test
      POSTGRES_PASSWORD: podoria_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podoria_test -d podoria_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-podoria_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-podoria_minio_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-podoria_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-podoria_minio_dev_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-podoria-private}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"
        /usr/bin/mc anonymous set private "local/$${MINIO_BUCKET_NAME}"
    restart: "no"

  backend:
    image: podoria-crm-backend
    build:
      context: ./backend
    environment: &backend-environment
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-before-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,proxy}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-}
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-24}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-43200}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_RATE_LIMIT_EMAIL_ATTEMPTS: ${LOGIN_RATE_LIMIT_EMAIL_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-30}
      POSTGRES_DB: ${POSTGRES_DB:-podoria}
      POSTGRES_USER: ${POSTGRES_USER:-podoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podoria_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_HEALTH_URL: http://minio:9000/minio/health/ready
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-podoria_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-podoria_minio_dev_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-podoria-private}
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    image: podoria-crm-backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: podoria-crm-backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    image: podoria-crm-backend-test
    build:
      context: ./backend
    command: ["sh", "/app/scripts/check.sh"]
    environment:
      <<: *backend-environment
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: test-only-security-gate-secret-key-not-for-production
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
      POSTGRES_DB: podoria_test
      POSTGRES_USER: podoria_test
      POSTGRES_PASSWORD: podoria_test_password
      POSTGRES_HOST: test-postgres
    depends_on:
      test-postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: podoria-crm-web
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend-test:
    profiles: ["test"]
    image: podoria-crm-frontend-test
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: source
    command: ["npm", "run", "check"]
    restart: "no"

  frontend-tools:
    profiles: ["tools"]
    image: podoria-crm-frontend-tools
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: source
    command: ["npm", "run", "generate:api"]
    volumes:
      - ./frontend/src:/app/src
      - ./backend/openapi:/app/openapi:ro
    restart: "no"

  proxy:
    image: nginx:1.28.3-alpine
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
