upstream podoria_backend {
    server backend:8000;
}

upstream podoria_web {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://podoria_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /health/ {
        proxy_pass http://podoria_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location / {
        proxy_pass http://podoria_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
