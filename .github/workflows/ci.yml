name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run Docker test profile
        run: sh ./scripts/run-tests.sh
      - name: Verify generated artifacts are committed
        run: git diff --exit-code
      - name: Clean up containers
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
